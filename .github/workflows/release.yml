name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DOCKSIDE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "DOCKSIDE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          DOCKSIDE_KEYSTORE_PASSWORD: ${{ secrets.DOCKSIDE_KEYSTORE_PASSWORD }}
          DOCKSIDE_KEY_ALIAS: ${{ secrets.DOCKSIDE_KEY_ALIAS }}
          DOCKSIDE_KEY_PASSWORD: ${{ secrets.DOCKSIDE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Dockside-${GITHUB_REF_NAME#v}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: Dockside-*.apk
          generate_release_notes: true
